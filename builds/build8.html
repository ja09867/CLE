    html { min-height: 100%; }

    .build-page-content {
        padding: 90px 20px 20px;
        max-width: 900px;
        margin: 0 auto;
        width: 90%;
    }
    .build-page-title {
        text-align: center;
        margin-bottom: 20px;
        padding: 25px;
        border-radius: 50px;
        background: linear-gradient(90deg, rgba(255,204,102,0.1), rgba(0,180,255,0.1), rgba(255,204,102,0.1));
        border: 1px solid rgba(255,204,102,0.3);
    }
    .build-page-title h1 {
        font-size: 2rem;
        color: #ffcc66;
        margin-bottom: 8px;
    }
    .build-page-title p {
        color: #ccc;
        font-size: 1rem;
    }
    .videos-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 24px;
        margin-bottom: 10px;
    }
    @media (max-width: 640px) {
        .videos-grid { grid-template-columns: 1fr; }
        .build-page-title h1 { font-size: 1.4rem; }
    }
    .video-card {
        background: rgba(20, 20, 30, 0.95);
        border: 1px solid rgba(255,204,102,0.2);
        border-radius: 16px;
        overflow: hidden;
        transition: transform 0.3s, box-shadow 0.3s;
        box-shadow: 0 5px 20px rgba(0,0,0,0.4);
    }
    .video-card:hover {
        transform: translateY(-4px);
        box-shadow: 0 10px 30px rgba(0,180,255,0.2);
    }

    .video-thumb {
        position: relative;
        width: 100%;
        padding-bottom: 56.25%;
        overflow: hidden;
        background: #000;
        display: block;
    }
    .video-thumb img {
        position: absolute;
        top: 0; left: 0;
        width: 100%; height: 100%;
        object-fit: cover;
        transition: opacity 0.3s;
    }
    .video-thumb:hover img { opacity: 0.75; }
    .play-btn {
        position: absolute;
        top: 50%; left: 50%;
        transform: translate(-50%, -50%);
        width: 64px; height: 64px;
        background: rgba(255,0,0,0.85);
        border-radius: 50%;
        display: flex; align-items: center; justify-content: center;
        pointer-events: none;
        transition: background 0.3s;
    }
    .video-thumb:hover .play-btn { background: rgba(255,0,0,1); }
    .play-btn svg { width: 28px; height: 28px; fill: white; margin-left: 4px; }

    .video-label {
        padding: 14px 16px;
        font-size: 0.9rem;
        color: #ccc;
        border-top: 1px solid rgba(255,255,255,0.07);
        text-align: center;
    }
    .placeholder-box {
        background: rgba(255,204,102,0.08);
        border: 2px dashed rgba(255,204,102,0.4);
        border-radius: 16px;
        padding: 40px 20px;
        text-align: center;
        color: #ffcc66;
        font-size: 0.95rem;
        margin-bottom: 10px;
    }
    .placeholder-box p { margin-top: 10px; color: #aaa; font-size: 0.85rem; }
    .back-link-bottom {
        text-align: center;
        margin-top: 10px;
    }
    .back-link-bottom a {
        display: inline-block;
        color: white;
        background: rgba(255,204,102,0.15);
        border: 1px solid #ffcc66;
        padding: 12px 30px;
        border-radius: 30px;
        text-decoration: none;
        font-weight: bold;
        transition: background 0.3s;
    }
    .back-link-bottom a:hover { background: rgba(255,204,102,0.3); }
    html, body { height: auto !important; min-height: 100%; }
    .sub-main-1 { overflow: visible !important; height: auto !important; min-height: 100vh !important; }

<script src="https://unpkg.com/aos@2.3.4/dist/aos.js"></script>
<script>
    AOS.init({ duration: 1000, once: false, mirror: false });
    document.addEventListener('DOMContentLoaded', function() {
        const menuToggle = document.createElement('div');
        menuToggle.className = 'menu-toggle';
        menuToggle.innerHTML = '☰';
        document.querySelector('.navbar').appendChild(menuToggle);
        const navMenu = document.querySelector('.menu');
        menuToggle.addEventListener('click', function() { navMenu.classList.toggle('active'); });
        document.querySelectorAll('.menu ul li a').forEach(link => {
            link.addEventListener('click', function() { navMenu.classList.remove('active'); });
        });
    });
</script>
